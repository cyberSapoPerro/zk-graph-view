[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-graph-view"
version = "0.1.4"
description = "Visualize zk graphs in an HTML file"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pyvis",
  "colorir",
  "typing",
]

[project.scripts]
zk-graph-view = "zk_graph_view.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
